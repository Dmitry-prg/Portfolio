<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Портфолио</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f4f6fb;
      color: #1f2937;
      line-height: 1.6;
      padding: 32px 16px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    /* ---------- Профиль ---------- */
    .profile {
      background: #fff;
      border-radius: 16px;
      padding: 32px;
      display: flex;
      gap: 28px;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      margin-bottom: 40px;
    }

    .profile__avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 4px solid #eef2ff;
      background: #e5e7eb;
    }

    .profile__info { flex: 1; }

    .profile__name {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .profile__position {
      color: #6366f1;
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 12px;
    }

    .profile__about {
      color: #4b5563;
      margin-bottom: 16px;
      font-size: 15px;
    }

    .profile__contacts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-bottom: 16px;
    }

    .profile__contacts a {
      color: #4b5563;
      text-decoration: none;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .profile__contacts a:hover { color: #6366f1; }

    .profile__contacts a::before {
      content: "•";
      color: #6366f1;
      font-weight: bold;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .skills span {
      background: #eef2ff;
      color: #4338ca;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
    }

    /* ---------- Проекты ---------- */
    .block { margin-bottom: 40px; }

    .block__title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .block__title::before {
      content: "";
      width: 6px;
      height: 24px;
      background: #6366f1;
      border-radius: 4px;
      display: inline-block;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 28px rgba(99, 102, 241, 0.15);
    }

    .card__image {
      width: 100%;
      height: 170px;
      object-fit: cover;
      background: #e5e7eb;
    }

    .card__body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card__title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .card__description {
      color: #6b7280;
      font-size: 14px;
      flex: 1;
      margin-bottom: 12px;
    }

    .card__tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }

    .card__tags span {
      background: #f3f4f6;
      color: #374151;
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 6px;
    }

    .card__link {
      color: #6366f1;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: color 0.2s;
    }

    .card__link:hover { color: #4338ca; }

    /* ---------- Скелетон загрузки ---------- */
    .skeleton {
      max-width: 960px;
      margin: 0 auto;
    }

    .skeleton__box {
      background: linear-gradient(90deg, #eceff5 25%, #f6f8fc 50%, #eceff5 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 12px;
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton__profile {
      height: 200px;
      margin-bottom: 40px;
      border-radius: 16px;
    }

    .skeleton__row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .skeleton__card { height: 300px; }

    /* ---------- Заглушка при ошибке ---------- */
    .error {
      max-width: 520px;
      margin: 60px auto;
      background: #fff;
      border-radius: 20px;
      padding: 48px 32px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .error__icon {
      font-size: 64px;
      line-height: 1;
      margin-bottom: 20px;
      display: inline-block;
      animation: wobble 2.5s ease-in-out infinite;
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(0); }
      25%      { transform: rotate(-8deg); }
      75%      { transform: rotate(8deg); }
    }

    .error__title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #1f2937;
    }

    .error__text {
      color: #6b7280;
      font-size: 15px;
      margin-bottom: 24px;
    }

    .error__btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #6366f1;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      font-family: inherit;
    }

    .error__btn:hover {
      background: #4f46e5;
      transform: translateY(-2px);
    }

    .error__btn:active { transform: translateY(0); }

    /* ---------- Адаптив ---------- */
    @media (max-width: 640px) {
      .profile {
        flex-direction: column;
        text-align: center;
        padding: 24px;
      }
      .profile__contacts { justify-content: center; }
      .skills { justify-content: center; }
    }
  </style>
</head>
<body>

  <div class="container">
    <section id="profile" class="profile"></section>
    <div id="projects"></div>
  </div>

  <script>
    // ---------- Утилиты ----------
    function escapeHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ---------- Рендер профиля ----------
    function renderProfile(p) {
      const contacts = (p.contacts || []).map(c =>
        `<a href="${escapeHtml(c.url)}" target="_blank" rel="noopener">${escapeHtml(c.label)}</a>`
      ).join('');

      const skills = (p.skills || [])
        .map(s => `<span>${escapeHtml(s)}</span>`)
        .join('');

      return `
        <img class="profile__avatar" src="${escapeHtml(p.avatar)}" alt="${escapeHtml(p.name)}" />
        <div class="profile__info">
          <h1 class="profile__name">${escapeHtml(p.name)}</h1>
          <div class="profile__position">${escapeHtml(p.position)}</div>
          <p class="profile__about">${escapeHtml(p.about)}</p>
          <div class="profile__contacts">${contacts}</div>
          <div class="skills">${skills}</div>
        </div>
      `;
    }

    // ---------- Рендер карточки проекта ----------
    function renderProjectCard(item) {
      const tags = (item.tags || [])
        .map(t => `<span>${escapeHtml(t)}</span>`)
        .join('');

      return `
        <article class="card">
          <img class="card__image" src="${escapeHtml(item.image)}" alt="${escapeHtml(item.title)}" />
          <div class="card__body">
            <h3 class="card__title">${escapeHtml(item.title)}</h3>
            <p class="card__description">${escapeHtml(item.description)}</p>
            <div class="card__tags">${tags}</div>
            <a class="card__link" href="${escapeHtml(item.link)}" target="_blank" rel="noopener">
              Посмотреть →
            </a>
          </div>
        </article>
      `;
    }

    // ---------- Рендер блоков проектов ----------
    function renderProjects(blocks) {
      return blocks.map(block => `
        <section class="block">
          <h2 class="block__title">${escapeHtml(block.block)}</h2>
          <div class="projects">
            ${(block.items || []).map(renderProjectCard).join('')}
          </div>
        </section>
      `).join('');
    }

    // ---------- Скелетон загрузки ----------
    function renderSkeleton() {
      document.body.innerHTML = `
        <div class="skeleton">
          <div class="skeleton__box skeleton__profile"></div>
          <div class="skeleton__row">
            <div class="skeleton__box skeleton__card"></div>
            <div class="skeleton__box skeleton__card"></div>
            <div class="skeleton__box skeleton__card"></div>
          </div>
        </div>
      `;
    }

    // ---------- Заглушка при ошибке ----------
    function renderError() {
      document.body.innerHTML = `
        <div class="error">
          <div class="error__icon">📭</div>
          <h2 class="error__title">Не удалось загрузить информацию</h2>
          <p class="error__text">
            Что-то пошло не так. Попробуйте обновить страницу<br>
            или загляните позже.
          </p>
          <button class="error__btn" onclick="location.reload()">
            🔄 Попробовать снова
          </button>
        </div>
      `;
    }

    // ---------- Инициализация ----------
    async function init() {
      renderSkeleton();

      try {
        const res = await fetch('data.json');
        if (!res.ok) throw new Error('fetch failed');

        let data;
        try {
          data = await res.json();
        } catch {
          throw new Error('invalid json');
        }

        if (!data.profile || !Array.isArray(data.projects)) {
          throw new Error('invalid structure');
        }

        // Восстанавливаем контейнер (был заменён скелетоном)
        document.body.innerHTML = `
          <div class="container">
            <section id="profile" class="profile"></section>
            <div id="projects"></div>
          </div>
        `;

        document.getElementById('profile').innerHTML = renderProfile(data.profile);
        document.getElementById('projects').innerHTML = renderProjects(data.projects);
      } catch (err) {
        console.error('Ошибка загрузки данных:', err);
        renderError();
      }
    }

    init();
  </script>

</body>
</html>
