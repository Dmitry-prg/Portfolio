<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Портфолио" />
  <title>Портфолио</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/jpeg" href="./a.jpeg" />
  <link rel="apple-touch-icon" href="./a.jpeg" />

  <style>
    :root {
      --bg: #0f1220;
      --bg-soft: #161a2e;
      --card: #1a1f38;
      --border: rgba(255, 255, 255, 0.08);
      --text: #e8ecff;
      --text-dim: #9aa3c7;
      --accent: #7c8cff;
      --accent-2: #b06cff;
      --accent-3: #4ad8d8;
      --radius: 20px;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      --topbar-h: 64px;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      min-height: 100vh;
      padding: 96px 20px 80px;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body::before, body::after {
      content: "";
      position: fixed;
      width: 600px; height: 600px;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      background: radial-gradient(circle, var(--accent), transparent 70%);
      top: -200px; left: -200px;
      animation: float1 18s ease-in-out infinite;
    }
    body::after {
      background: radial-gradient(circle, var(--accent-2), transparent 70%);
      bottom: -250px; right: -200px;
      animation: float2 22s ease-in-out infinite;
    }
    @keyframes float1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(80px,60px); } }
    @keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-70px,-50px); } }

    .container { max-width: 1040px; margin: 0 auto; position: relative; z-index: 1; }

    /* ================= TOPBAR ================= */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--topbar-h);
      z-index: 100;
      background: rgba(15, 18, 32, 0);
      border-bottom: 1px solid transparent;
      backdrop-filter: blur(0px);
      -webkit-backdrop-filter: blur(0px);
      transition: background 0.4s ease, border-color 0.4s ease, backdrop-filter 0.4s ease;
      pointer-events: none;
    }

    .topbar--visible {
      background: rgba(15, 18, 32, 0.72);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      border-bottom-color: var(--border);
      pointer-events: auto;
    }

    .topbar__inner {
      max-width: 1040px;
      height: 100%;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .topbar__left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      cursor: pointer;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.45s var(--ease), transform 0.5s var(--ease);
    }
    .topbar--visible .topbar__left { opacity: 1; transform: translateY(0); }

    .topbar__avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--card);
      border: 2px solid transparent;
      background-image:
        linear-gradient(var(--card), var(--card)) padding-box,
        linear-gradient(135deg, var(--accent), var(--accent-2)) border-box;
      box-shadow: 0 4px 16px rgba(124, 140, 255, 0.35);
      transform: scale(0.6);
      transition: transform 0.55s var(--ease);
    }
    .topbar--visible .topbar__avatar { transform: scale(1); }

    .topbar__name {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.01em;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    .topbar__actions {
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.45s var(--ease) 0.06s, transform 0.5s var(--ease) 0.06s;
    }
    .topbar--visible .topbar__actions { opacity: 1; transform: translateY(0); }

    .topbar__btn {
      width: 40px; height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
    }
    .topbar__btn:hover {
      color: var(--text);
      background: rgba(124, 140, 255, 0.16);
      border-color: rgba(124, 140, 255, 0.5);
      transform: translateY(-2px);
    }
    .topbar__btn svg { width: 20px; height: 20px; }

    .dropdown-wrap { position: relative; }

    .dropdown {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      min-width: 260px;
      background: linear-gradient(160deg, rgba(30, 36, 66, 0.98), rgba(22, 26, 46, 0.98));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      opacity: 0;
      transform: translateY(-8px) scale(0.96);
      transform-origin: top right;
      pointer-events: none;
      transition: opacity 0.25s var(--ease), transform 0.3s var(--ease);
      z-index: 101;
    }
    .dropdown--open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .dropdown__item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .dropdown__item:hover {
      background: rgba(124, 140, 255, 0.14);
      color: var(--text);
    }
    .dropdown__item svg {
      width: 18px; height: 18px;
      flex-shrink: 0;
      color: var(--accent);
    }

    /* ================= ПРОФИЛЬ ================= */
    .profile {
      background: linear-gradient(145deg, rgba(30, 36, 66, 0.9), rgba(22, 26, 46, 0.85));
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 44px;
      display: flex;
      gap: 40px;
      align-items: center;
      box-shadow: var(--shadow);
      margin-bottom: 56px;
      position: relative;
      overflow: hidden;
      animation: riseIn 0.7s var(--ease);
    }
    .profile::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), transparent);
      opacity: 0.8;
    }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .profile__avatar-wrap { position: relative; flex-shrink: 0; }

    .profile__avatar {
      width: 150px; height: 150px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      position: relative;
      z-index: 1;
      border: 3px solid transparent;
      background:
        linear-gradient(var(--card), var(--card)) padding-box,
        linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent-3)) border-box;
    }

    .profile__avatar-wrap::after {
      content: "";
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      filter: blur(24px);
      opacity: 0.5;
      z-index: 0;
      animation: pulse 3.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 0.4; transform: scale(1); }
      50%     { opacity: 0.65; transform: scale(1.06); }
    }

    .profile__info { flex: 1; min-width: 0; }

    .profile__name {
      font-size: clamp(26px, 4vw, 36px);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ffffff 0%, #b8c1ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.15;
    }

    .profile__position {
      display: inline-block;
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 18px;
      padding: 5px 14px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(124, 140, 255, 0.18), rgba(176, 108, 255, 0.18));
      border: 1px solid rgba(124, 140, 255, 0.3);
      color: #c2cbff;
    }

    .profile__about {
      color: var(--text-dim);
      margin-bottom: 22px;
      font-size: 15.5px;
      max-width: 620px;
    }

    .profile__contacts {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 22px;
    }
    .profile__contacts a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      padding: 7px 14px 7px 11px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .profile__contacts a:hover {
      color: var(--text);
      background: rgba(124, 140, 255, 0.14);
      border-color: rgba(124, 140, 255, 0.5);
      transform: translateY(-2px);
    }
    .profile__contacts svg {
      width: 16px; height: 16px;
      color: var(--accent);
      flex-shrink: 0;
    }

    .skills { display: flex; flex-wrap: wrap; gap: 8px; }
    .skills span {
      font-size: 12.5px;
      font-weight: 600;
      padding: 5px 13px;
      border-radius: 8px;
      color: #b9c2ff;
      background: rgba(124, 140, 255, 0.1);
      border: 1px solid rgba(124, 140, 255, 0.22);
      transition: all 0.25s ease;
    }
    .skills span:hover {
      background: rgba(124, 140, 255, 0.22);
      color: #e2e6ff;
      transform: translateY(-2px);
    }

    /* ================= ПРОЕКТЫ ================= */
    .block {
      margin-bottom: 52px;
      animation: riseIn 0.7s var(--ease) both;
    }
    .block:nth-of-type(2) { animation-delay: 0.08s; }
    .block:nth-of-type(3) { animation-delay: 0.16s; }
    .block:nth-of-type(4) { animation-delay: 0.24s; }

    .block__title {
      font-size: clamp(20px, 2.5vw, 24px);
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: #eef1ff;
    }
    .block__title::before {
      content: "";
      width: 4px; height: 26px;
      border-radius: 4px;
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 20px rgba(124, 140, 255, 0.6);
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }

    .card {
      background: linear-gradient(160deg, rgba(30, 36, 66, 0.9), rgba(22, 26, 46, 0.9));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      transition: transform 0.4s var(--ease), box-shadow 0.4s ease, border-color 0.3s ease;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      padding: 1px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
              mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
    }
    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 24px 60px rgba(124, 140, 255, 0.22);
    }
    .card:hover::after { opacity: 1; }

    .card__image-wrap {
      overflow: hidden;
      height: 190px;
      background: var(--bg-soft);
      position: relative;
    }
    .card__image {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s var(--ease);
    }
    .card:hover .card__image { transform: scale(1.08); }
    .card__image-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(15, 18, 32, 0.85));
      pointer-events: none;
    }

    .card__body {
      padding: 22px 22px 24px;
      display: flex;
      flex-direction: column;
      flex: 1;
      position: relative;
      z-index: 1;
    }
    .card__title {
      font-size: 17.5px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -0.01em;
      color: #f0f2ff;
    }
    .card__description {
      color: var(--text-dim);
      font-size: 14px;
      flex: 1;
      margin-bottom: 16px;
    }
    .card__tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
    .card__tags span {
      font-size: 11.5px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(176, 108, 255, 0.12);
      color: #c9b6ff;
      border: 1px solid rgba(176, 108, 255, 0.22);
    }
    .card__link {
      align-self: flex-start;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: gap 0.25s ease, color 0.25s ease;
    }
    .card__link:hover { color: var(--accent-2); gap: 12px; }

    /* ================= СКЕЛЕТОН ================= */
    .skeleton {
      max-width: 1040px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }
    .skeleton__box {
      background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.09) 50%, rgba(255,255,255,0.04) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .skeleton__profile { height: 220px; margin-bottom: 56px; border-radius: 28px; }
    .skeleton__row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
      margin-bottom: 40px;
    }
    .skeleton__card { height: 340px; border-radius: var(--radius); }

    /* ================= ЗАГЛУШКА ================= */
    .error {
      max-width: 520px;
      margin: 80px auto;
      background: linear-gradient(160deg, rgba(30, 36, 66, 0.95), rgba(22, 26, 46, 0.95));
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 56px 36px;
      text-align: center;
      box-shadow: var(--shadow);
      position: relative;
      z-index: 1;
      animation: riseIn 0.6s var(--ease);
    }
    .error::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-2), var(--accent), transparent);
      border-radius: 28px 28px 0 0;
    }
    .error__icon {
      font-size: 72px;
      line-height: 1;
      margin-bottom: 24px;
      display: inline-block;
      animation: wobble 2.5s ease-in-out infinite;
      filter: drop-shadow(0 8px 24px rgba(176, 108, 255, 0.4));
    }
    @keyframes wobble {
      0%,100% { transform: rotate(0); }
      25%     { transform: rotate(-8deg); }
      75%     { transform: rotate(8deg); }
    }
    .error__title {
      font-size: 24px; font-weight: 700;
      margin-bottom: 12px; color: #f0f2ff;
      letter-spacing: -0.01em;
    }
    .error__text { color: var(--text-dim); font-size: 15px; margin-bottom: 28px; line-height: 1.6; }
    .error__btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 10px 30px rgba(124, 140, 255, 0.35);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .error__btn:hover { transform: translateY(-3px); box-shadow: 0 16px 40px rgba(124, 140, 255, 0.5); }

    /* ================= TOAST ================= */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translate(-50%, 100px);
      background: linear-gradient(135deg, rgba(30, 36, 66, 0.98), rgba(22, 26, 46, 0.98));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 22px;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.45s var(--ease);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .toast--show {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    .toast svg { width: 18px; height: 18px; color: var(--accent-3); }

    /* ================= АДАПТИВ ================= */
    @media (max-width: 720px) {
      body { padding: 84px 14px 60px; }
      .topbar__inner { padding: 0 14px; }
      .topbar__name { max-width: 140px; }

      .profile {
        flex-direction: column;
        text-align: center;
        padding: 32px 22px;
        gap: 28px;
      }
      .profile__info { text-align: center; }
      .profile__about { max-width: 100%; }
      .profile__contacts { justify-content: center; }
      .skills { justify-content: center; }
      .profile__avatar { width: 120px; height: 120px; }

      .projects { grid-template-columns: 1fr; }
      .card__image-wrap { height: 170px; }

      .dropdown { min-width: 220px; right: -8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- ===== Шапка ===== -->
  <header class="topbar" id="topbar">
    <div class="topbar__inner">
      <div class="topbar__left" id="topbarLeft">
        <img class="topbar__avatar" id="topbarAvatar" alt="" />
        <span class="topbar__name" id="topbarName"></span>
      </div>
      <div class="topbar__actions">
        <div class="dropdown-wrap">
          <button class="topbar__btn" id="contactsBtn" aria-label="Контакты">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </button>
          <div class="dropdown" id="contactsDropdown"></div>
        </div>
        <button class="topbar__btn" id="shareBtn" aria-label="Поделиться">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"/>
            <circle cx="6" cy="12" r="3"/>
            <circle cx="18" cy="19" r="3"/>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ===== Контент ===== -->
  <div class="container">
    <section id="profile" class="profile"></section>
    <div id="projects"></div>
  </div>

  <!-- ===== Toast ===== -->
  <div class="toast" id="toast">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    <span id="toastText">Готово</span>
  </div>

  <script>
    // ================= ИКОНКИ КОНТАКТОВ =================
    const CONTACT_ICONS = {
      email: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M22 6l-10 7L2 6"/></svg>`,

    };

    function contactIcon(type) {
      const key = (type || '').toLowerCase();
      return CONTACT_ICONS[key] || CONTACT_ICONS.default;
    }

    // ================= УТИЛИТЫ =================
    function escapeHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ================= РЕНДЕР =================
    function renderProfile(p) {
      const contacts = (p.contacts || []).map(c =>
        `<a href="${escapeHtml(c.url)}" target="_blank" rel="noopener">
          ${contactIcon(c.type)}
          <span>${escapeHtml(c.label)}</span>
        </a>`
      ).join('');

      const skills = (p.skills || [])
        .map(s => `<span>${escapeHtml(s)}</span>`)
        .join('');

      return `
        <div class="profile__avatar-wrap">
          <img class="profile__avatar" src="${escapeHtml(p.avatar)}" alt="${escapeHtml(p.name)}" />
        </div>
        <div class="profile__info">
          <h1 class="profile__name">${escapeHtml(p.name)}</h1>
          <div class="profile__position">${escapeHtml(p.position)}</div>
          <p class="profile__about">${escapeHtml(p.about)}</p>
          <div class="profile__contacts">${contacts}</div>
          <div class="skills">${skills}</div>
        </div>
      `;
    }

    function renderProjectCard(item) {
      const tags = (item.tags || [])
        .map(t => `<span>${escapeHtml(t)}</span>`)
        .join('');

      return `
        <article class="card">
          <div class="card__image-wrap">
            <img class="card__image" src="${escapeHtml(item.image)}" alt="${escapeHtml(item.title)}" loading="lazy" />
          </div>
          <div class="card__body">
            <h3 class="card__title">${escapeHtml(item.title)}</h3>
            <p class="card__description">${escapeHtml(item.description)}</p>
            <div class="card__tags">${tags}</div>
            <a class="card__link" href="${escapeHtml(item.link)}" target="_blank" rel="noopener">
              Посмотреть <span>→</span>
            </a>
          </div>
        </article>
      `;
    }

    function renderProjects(blocks) {
      return blocks.map(block => `
        <section class="block">
          <h2 class="block__title">${escapeHtml(block.block)}</h2>
          <div class="projects">
            ${(block.items || []).map(renderProjectCard).join('')}
          </div>
        </section>
      `).join('');
    }

    function renderSkeleton() {
      document.body.insertAdjacentHTML('beforeend', `
        <div class="skeleton" id="skeleton">
          <div class="skeleton__box skeleton__profile"></div>
          <div class="skeleton__row">
            <div class="skeleton__box skeleton__card"></div>
            <div class="skeleton__box skeleton__card"></div>
            <div class="skeleton__box skeleton__card"></div>
          </div>
        </div>
      `);
    }

    function renderError() {
      const container = document.querySelector('.container');
      if (container) container.innerHTML = `
        <div class="error">
          <div class="error__icon">📭</div>
          <h2 class="error__title">Не удалось загрузить информацию</h2>
          <p class="error__text">Что-то пошло не так. Попробуйте обновить страницу<br>или загляните позже.</p>
          <button class="error__btn" onclick="location.reload()">🔄 Попробовать снова</button>
        </div>
      `;
    }

    // ================= TOPBAR =================
    function setupTopbar(profile) {
      document.getElementById('topbarAvatar').src = profile.avatar || '';
      document.getElementById('topbarName').textContent = profile.name || '';

      const dd = document.getElementById('contactsDropdown');
      dd.innerHTML = (profile.contacts || []).map(c => `
        <a class="dropdown__item" href="${escapeHtml(c.url)}" target="_blank" rel="noopener">
          ${contactIcon(c.type)}
          <span>${escapeHtml(c.label)}</span>
        </a>
      `).join('');

      document.getElementById('topbarLeft').addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      const contactsBtn = document.getElementById('contactsBtn');
      contactsBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        dd.classList.toggle('dropdown--open');
      });

      document.addEventListener('click', (e) => {
        if (!dd.contains(e.target) && e.target !== contactsBtn) {
          dd.classList.remove('dropdown--open');
        }
      });
    }

    function setupScrollWatcher() {
      const topbar = document.getElementById('topbar');
      const profile = document.querySelector('.profile');
      let visible = false;

      function check() {
        if (!profile) return;
        const shouldShow = profile.getBoundingClientRect().bottom < 90;
        if (shouldShow !== visible) {
          visible = shouldShow;
          topbar.classList.toggle('topbar--visible', visible);
          if (!visible) {
            document.getElementById('contactsDropdown').classList.remove('dropdown--open');
          }
        }
      }

      window.addEventListener('scroll', check, { passive: true });
      window.addEventListener('resize', check, { passive: true });
      check();
    }

    // ================= SHARE =================
    function setupShare(profile) {
      document.getElementById('shareBtn').addEventListener('click', async () => {
        const shareData = {
          title: document.title,
          text: profile.name ? `Портфолио — ${profile.name}` : 'Портфолио',
          url: location.href
        };
        try {
          if (navigator.share) {
            await navigator.share(shareData);
          } else if (navigator.clipboard) {
            await navigator.clipboard.writeText(location.href);
            showToast('Ссылка скопирована');
          } else {
            showToast('Скопируйте ссылку из адресной строки');
          }
        } catch (e) {}
      });
    }

    function showToast(text) {
      const toast = document.getElementById('toast');
      document.getElementById('toastText').textContent = text;
      toast.classList.add('toast--show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toast.classList.remove('toast--show'), 2200);
    }

    // ================= PWA =================
    function registerSW() {
      if (!('serviceWorker' in navigator)) return;
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    // ================= INIT =================
    async function init() {
      renderSkeleton();
      registerSW();

      try {
        const res = await fetch('./data.json');
        if (!res.ok) throw new Error('fetch failed');

        let data;
        try {
          data = await res.json();
        } catch {
          throw new Error('invalid json');
        }

        if (!data.profile || !Array.isArray(data.projects)) {
          throw new Error('invalid structure');
        }

        const sk = document.getElementById('skeleton');
        if (sk) sk.remove();

        document.getElementById('profile').innerHTML = renderProfile(data.profile);
        document.getElementById('projects').innerHTML = renderProjects(data.projects);

        setupTopbar(data.profile);
        setupShare(data.profile);
        setupScrollWatcher();
      } catch (err) {
        console.error('Ошибка загрузки данных:', err);
        const sk = document.getElementById('skeleton');
        if (sk) sk.remove();
        renderError();
      }
    }

    init();
  </script>
